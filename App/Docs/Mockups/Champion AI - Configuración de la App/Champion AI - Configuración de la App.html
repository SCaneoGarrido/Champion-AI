<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configuración | Champion AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-container": "#5a9fed",
              "surface-container": "#f0eded",
              "outline": "#827562",
              "tertiary": "#0060a8",
              "surface-container-high": "#eae7e7",
              "primary": "#7c5800",
              "tertiary-fixed-dim": "#a1c9ff",
              "inverse-on-surface": "#f3f0ef",
              "inverse-primary": "#f9bc3d",
              "surface-tint": "#7c5800",
              "on-background": "#1c1b1b",
              "surface-dim": "#dcd9d9",
              "primary-fixed-dim": "#f9bc3d",
              "primary-container": "#c9920a",
              "on-tertiary-fixed-variant": "#004880",
              "on-secondary-fixed": "#271900",
              "surface-container-low": "#f6f3f2",
              "error-container": "#ffdad6",
              "primary-fixed": "#ffdea6",
              "surface-bright": "#fcf9f8",
              "on-tertiary-container": "#003560",
              "on-surface": "#1c1b1b",
              "secondary-fixed-dim": "#fbbc36",
              "on-surface-variant": "#504534",
              "on-error-container": "#93000a",
              "background": "#fcf9f8",
              "on-secondary": "#ffffff",
              "secondary": "#7c5800",
              "on-primary-container": "#453000",
              "surface-variant": "#e5e2e1",
              "outline-variant": "#d4c4ae",
              "on-error": "#ffffff",
              "surface-container-highest": "#e5e2e1",
              "on-secondary-container": "#6f4f00",
              "secondary-container": "#febf39",
              "on-tertiary": "#ffffff",
              "on-primary-fixed": "#271900",
              "error": "#ba1a1a",
              "tertiary-fixed": "#d2e4ff",
              "inverse-surface": "#313030",
              "secondary-fixed": "#ffdea6",
              "on-primary-fixed-variant": "#5e4200",
              "on-tertiary-fixed": "#001c38",
              "on-primary": "#ffffff",
              "surface": "#fcf9f8",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed-variant": "#5e4200"
            },
            fontFamily: {
              "headline": ["Sora", "sans-serif"],
              "body": ["Plus Jakarta Sans", "sans-serif"],
              "label": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      h1, h2, h3, .brand-font {
        font-family: 'Sora', sans-serif;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fcf9f8] dark:bg-slate-950 backdrop-blur-md bg-opacity-80 flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-[#7c5800] dark:text-[#C9920A] active:scale-95 duration-200 transition-colors p-2 rounded-full hover:bg-[#f6f3f2] dark:hover:bg-slate-800">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<span class="text-xl font-bold text-[#7c5800] dark:text-[#C9920A] tracking-tighter brand-font">Champion AI</span>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-sm shadow-sm ring-2 ring-white ring-offset-2">
                SC
            </div>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto">
<!-- Header Presenter -->
<div class="flex justify-start mb-10">
<div class="bg-surface-container-low px-6 py-2 rounded-full border border-outline-variant/15 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="text-primary font-bold text-sm tracking-wide font-headline">Configuración de la App</span>
</div>
</div>
<!-- Main Settings Card -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-[0_8px_30px_rgba(124,88,0,0.04)] overflow-hidden mb-12">
<!-- Subscription -->
<button class="w-full flex items-center justify-between p-6 hover:bg-surface-bright transition-colors text-left group">
<div class="flex items-center gap-5">
<div class="w-12 h-12 rounded-2xl bg-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="card_membership">card_membership</span>
</div>
<div>
<p class="font-bold text-on-surface text-base">Gestionar suscripciones</p>
<p class="text-on-surface-variant text-sm mt-0.5">Plan actual: Gratuito</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Payments -->
<button class="w-full flex items-center justify-between p-6 hover:bg-surface-bright transition-colors text-left group">
<div class="flex items-center gap-5">
<div class="w-12 h-12 rounded-2xl bg-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="payments">payments</span>
</div>
<div>
<p class="font-bold text-on-surface text-base">Métodos de pago</p>
<p class="text-on-surface-variant text-sm mt-0.5">Sin método configurado</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Privacy -->
<button class="w-full flex items-center justify-between p-6 hover:bg-surface-bright transition-colors text-left group">
<div class="flex items-center gap-5">
<div class="w-12 h-12 rounded-2xl bg-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="lock_person">lock_person</span>
</div>
<div>
<p class="font-bold text-on-surface text-base">Configuración de privacidad</p>
<p class="text-on-surface-variant text-sm mt-0.5">Permisos y datos personales</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Support -->
<button class="w-full flex items-center justify-between p-6 hover:bg-surface-bright transition-colors text-left group border-t border-surface-container-low">
<div class="flex items-center gap-5">
<div class="w-12 h-12 rounded-2xl bg-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="help_center">help_center</span>
</div>
<div>
<p class="font-bold text-on-surface text-base">Soporte</p>
<p class="text-on-surface-variant text-sm mt-0.5">Ayuda, FAQ y contacto</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Account Section -->
<div class="mb-4">
<h3 class="text-[10px] font-bold tracking-[0.2em] text-outline ml-4 mb-4 uppercase font-label">CUENTA</h3>
<div class="space-y-3">
<!-- Notifications Toggle -->
<div class="bg-surface-container-lowest p-5 rounded-2xl flex items-center justify-between border border-surface-container-low/50 shadow-sm">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
<span class="font-semibold text-on-surface">Notificaciones</span>
</div>
<!-- Active Toggle -->
<div class="w-12 h-6 bg-primary-container rounded-full relative cursor-pointer shadow-inner">
<div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-md"></div>
</div>
</div>
<!-- Dark Mode Toggle -->
<div class="bg-surface-container-lowest p-5 rounded-2xl flex items-center justify-between border border-surface-container-low/50 shadow-sm">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="dark_mode">dark_mode</span>
<span class="font-semibold text-on-surface">Modo oscuro</span>
</div>
<!-- Inactive Toggle -->
<div class="w-12 h-6 bg-surface-container-high rounded-full relative cursor-pointer">
<div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
</div>
</div>
</div>
</div>
<!-- Logout / Danger Area -->
<div class="mt-12 text-center">
<button class="text-error font-bold text-sm tracking-tight hover:underline flex items-center justify-center gap-2 mx-auto">
<span class="material-symbols-outlined text-sm" data-icon="logout">logout</span>
                Cerrar sesión
            </button>
</div>
<!-- Footer -->
<footer class="mt-16 text-center space-y-1">
<p class="text-xs text-outline font-medium font-label">Versión 2.4.0 (Build 892)</p>
<p class="text-xs text-outline/60 font-medium font-label">© 2024 Champion AI. Todos los derechos reservados.</p>
</footer>
</main>
<!-- FAB -->
<button class="fixed bottom-8 right-8 w-16 h-16 rounded-full bg-gradient-to-br from-primary to-primary-container text-white flex items-center justify-center shadow-[0_8px_16px_rgba(201,146,10,0.3)] hover:scale-110 active:scale-95 transition-all z-[70]">
<span class="material-symbols-outlined text-3xl" data-icon="smart_toy" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</button>
</body></html>
